apiVersion: v1
kind: Pod
metadata:
  name: nginx #pod name

spec:
  containers:
  - name: nginx # container name
    image: nginx 
  
    volumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-logs
  - name: almalinux
    image: almalinux:9
    command: ["sleep","10000"]
    volumeMounts:
    - mountPath: /mnt/nginx-logs
      name: nginx-logs
      readOnly: true

    volumes:
    - name: nginx-logs
      emptyDir:
        sizekimit: 500Mi
